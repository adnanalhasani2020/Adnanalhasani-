plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.adnanalhasani.hospital'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adnanalhasani.hospital'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
}
