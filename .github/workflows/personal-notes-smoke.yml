name: Personal notes migration smoke test
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261105180000_commercial_personal_notes_reminders.sql'
      - 'supabase/tests/fixtures/personal_notes_schema_fixture.sql'
      - 'supabase/tests/database/personal_notes_smoke_test.sql'
      - '.github/workflows/personal-notes-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-notes:
    name: PostgreSQL 17 personal notes lifecycle smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Load isolated fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/personal_notes_schema_fixture.sql
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261105180000_commercial_personal_notes_reminders.sql
      - name: Verify personal note privacy and lifecycle
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/personal_notes_smoke_test.sql
