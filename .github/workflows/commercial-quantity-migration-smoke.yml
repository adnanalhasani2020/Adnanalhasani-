name: Commercial quantity migration smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/fixtures/commercial_integer_quantity_schema_fixture.sql'
      - 'supabase/tests/database/commercial_integer_quantity_migration_smoke_test.sql'
      - '.github/workflows/commercial-quantity-migration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-smoke:
    name: PostgreSQL 17 migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Load data-free production-shaped schema fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/commercial_integer_quantity_schema_fixture.sql
      - name: Apply quantity enforcement migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261105123000_commercial_integer_quantity_enforcement.sql
      - name: Verify constraints and idempotency boundary
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/commercial_integer_quantity_migration_smoke_test.sql
