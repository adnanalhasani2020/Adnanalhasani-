name: General customer supply request migration smoke test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261106102440_general_customer_supply_requests_forward_20261106.sql'
      - 'supabase/tests/fixtures/general_customer_supply_requests_schema_fixture.sql'
      - 'supabase/tests/database/general_customer_supply_requests_smoke_test.sql'
      - '.github/workflows/general-customer-supply-requests-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-request-migration:
    timeout-minutes: 10
    name: PostgreSQL 17 customer supply request lifecycle smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Load isolated customer supply fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/general_customer_supply_requests_schema_fixture.sql
      - name: Apply customer supply request migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106102440_general_customer_supply_requests_forward_20261106.sql
      - name: Verify customer submission, merchant review, notifications, purchase conversion and list limit
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/general_customer_supply_requests_smoke_test.sql
