name: Build Hospital Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hospital-android-apk-shell
    paths:
      - "android/**"
      - ".github/workflows/hospital-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hospital-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
