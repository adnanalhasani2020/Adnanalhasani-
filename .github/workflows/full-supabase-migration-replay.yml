name: Storage-location migration smoke test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/fixtures/commercial_inventory_storage_schema_fixture.sql'
      - 'supabase/tests/database/commercial_inventory_storage_transfer_smoke.sql'
      - '.github/workflows/full-supabase-migration-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-storage-smoke:
    timeout-minutes: 10
    name: PostgreSQL 17 storage allocation and transfer test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PostgreSQL service container
        run: |
          PG_CONTAINER_ID="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER_ID"
          echo "PG_CONTAINER_ID=$PG_CONTAINER_ID" >> "$GITHUB_ENV"

      - name: Load data-free production-shaped schema fixture
        run: docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/fixtures/commercial_inventory_storage_schema_fixture.sql

      - name: Apply storage-location ledger migration
        run: docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106100000_commercial_inventory_storage_transfers.sql

      - name: Apply reserved-stock allocation guard
        run: docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106110000_commercial_inventory_storage_reservation_guard.sql

      - name: Exercise permissions, reserved-stock guard, idempotency, transfer, and immutability
        run: docker exec -i "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/database/commercial_inventory_storage_transfer_smoke.sql
