name: Personal work notes migration smoke test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261106001452_commercial_personal_work_notes_forward_20261106.sql'
      - 'supabase/tests/fixtures/commercial_personal_work_notes_schema_fixture.sql'
      - 'supabase/tests/database/commercial_personal_work_notes_smoke_test.sql'
      - '.github/workflows/personal-work-notes-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-notes-migration:
    timeout-minutes: 10
    name: PostgreSQL 17 personal work notes lifecycle smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Load isolated personal notes fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/commercial_personal_work_notes_schema_fixture.sql
      - name: Apply personal notes migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106001452_commercial_personal_work_notes_forward_20261106.sql
      - name: Verify isolation, reminders, idempotency and completion
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/commercial_personal_work_notes_smoke_test.sql
