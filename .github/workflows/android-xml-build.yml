name: Android XML build
on:
  pull_request:
    paths:
      - "android-hospital/**"
      - ".github/workflows/android-xml-build.yml"
  push:
    branches: [main]
    paths:
      - "android-hospital/**"
      - ".github/workflows/android-xml-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile Android debug app
        working-directory: android-hospital
        run: gradle --no-daemon :app:assembleDebug
