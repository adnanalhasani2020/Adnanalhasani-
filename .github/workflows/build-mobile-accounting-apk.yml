name: Build Android Accounting APK
on:
  workflow_dispatch:
  push:
    branches: [mobile-accounting-app]
    paths: [mobile-accounting/**, .github/workflows/build-mobile-accounting-apk.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: mobile-accounting
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-accounting-debug-apk
          path: mobile-accounting/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
