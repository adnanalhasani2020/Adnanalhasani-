name: Build Android Accounting APK
on:
  workflow_dispatch:
  push:
    branches: [mobile-accounting-app]
    paths: [mobile-accounting/**, .github/workflows/build-mobile-accounting-apk.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: mobile-accounting
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-accounting-debug-apk
          path: mobile-accounting/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
