name: Customer order reservation migration smoke test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261105140000_commercial_customer_order_reservations.sql'
      - 'supabase/tests/fixtures/customer_order_reservations_schema_fixture.sql'
      - 'supabase/tests/database/customer_order_reservations_smoke_test.sql'
      - '.github/workflows/customer-order-reservation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservation-migration:
    timeout-minutes: 10
    name: PostgreSQL 17 reservation lifecycle smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Load isolated production-shaped reservation fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/customer_order_reservations_schema_fixture.sql
      - name: Apply reservation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261105140000_commercial_customer_order_reservations.sql
      - name: Verify atomic reservation, expiry policies, reminders and fulfillment
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/customer_order_reservations_smoke_test.sql
