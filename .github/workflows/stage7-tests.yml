name: Stage 7 Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'stage/**'
      - 'stage*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage7-tests:
    name: Stage 7 pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install project and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Run focused attachment tests
        run: >-
          python -m pytest -q
          tests/test_stage41_file_attachment_application.py
          tests/test_stage47_file_attachment_content.py
          tests/test_stage49_file_attachment_filesystem_store.py

      - name: Run full test suite
        run: python -m pytest -q
