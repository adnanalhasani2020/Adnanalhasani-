name: Stage 7 Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'stage*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage7-tests:
    name: Stage 7 pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install project and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Run Stage 7 tests
        run: python -m pytest -q
