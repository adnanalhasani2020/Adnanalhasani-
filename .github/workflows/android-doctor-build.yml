name: Android Doctor App Build

on:
  push:
    branches: [feature/doctor-workflow-ui]
    paths:
      - "android-app/**"
      - ".github/workflows/android-doctor-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-doctor-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hospital-doctor-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
